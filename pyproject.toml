[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
[project]
name = "pai-genesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "toshihiro_usuda", email = "toshihiro.usuda@fujifilm.com }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "genesis-world>=1.4.4",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "torchvision>=0.23.0",
]

[project.scripts]
pai-genesis = "pai_genesis:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
